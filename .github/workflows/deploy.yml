name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DEPLOY_TAG="main"

          IMAGE_TAGS=$(cat <<'EOF'
          tklcat/takealook-backend:main
          tklcat/takealook-backend:sha-${SHORT_SHA}
          EOF)

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            IMAGE_TAGS="${IMAGE_TAGS}
tklcat/takealook-backend:${GITHUB_REF_NAME}"
            DEPLOY_TAG="${GITHUB_REF_NAME}"
          fi

          {
            echo "tags<<EOF"
            echo "$IMAGE_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "deploy_tag=${DEPLOY_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.tags }}
          # Keep this as multiline string for docker/build-push-action

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IMAGE_TAG="${{ steps.image.outputs.deploy_tag }}"
            sudo docker pull tklcat/takealook-backend:${IMAGE_TAG}

            # Ensure Redis is running
            sudo docker inspect redis > /dev/null 2>&1 || \
              sudo docker run -d --name redis -p 6379:6379 --restart unless-stopped redis:7-alpine

            # Create cert directory and files
            sudo mkdir -p /app/cert
            echo "${{ secrets.TOSS_CERT_PUBLIC }}" | sudo tee /app/cert/public.crt > /dev/null
            echo "${{ secrets.TOSS_KEY_PRIVATE }}" | sudo tee /app/cert/private.key > /dev/null
            sudo chmod 600 /app/cert/private.key
            sudo chown 1000:1000 /app/cert/private.key || true

            # Stop and remove old app container
            sudo docker stop app || true
            sudo docker rm app || true

            # Run new app container with Redis link
            sudo docker run -d --name app -p 8080:8080 \
              --link redis:redis \
              -v /app/cert:/app/cert \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e DB_URL='${{ secrets.DB_URL }}' \
              -e JWT_SECURE='${{ secrets.JWT_SECURE }}' \
              -e R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }} \
              -e R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }} \
              -e R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }} \
              -e R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }} \
              -e TOSS_DECRYPTION_KEY='${{ secrets.TOSS_DECRYPTION_KEY }}' \
              -e TOSS_AAD='${{ secrets.TOSS_AAD }}' \
              -e TOSS_API_CERT_PATH=/app/cert/public.crt \
              -e TOSS_API_KEY_PATH=/app/cert/private.key \
              -e REDIS_HOST=redis \
              -e REDIS_PORT=6379 \
              tklcat/takealook-backend:${IMAGE_TAG}