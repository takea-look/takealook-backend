spring.r2dbc.url=${DB_URL:r2dbc:pool:postgresql://localhost/takealook}
spring.r2dbc.username=${DB_USERNAME:tkladmin}
spring.r2dbc.password=${DB_PASSWORD:tklpass}

jwt.secret=${JWT_SECURE:your-super-secret-key-that-is-long-enough-to-be-secure}
jwt.expiration-time=${JWT_EXP:3600000}

cloud.r2.account-id=${R2_ACCOUNT_ID:YOUR_ACCOUNT_ID}
cloud.r2.access-key=${R2_ACCESS_KEY:YOUR_ACCESS_KEY}
cloud.r2.secret-key=${R2_SECRET_KEY:YOUR_SECRET_KEY}
cloud.r2.bucket=${R2_BUCKET_NAME:YOUR_BUCKET_NAME}
cloud.r2.region=auto
cloud.r2.public-base-url=${R2_PUBLIC_BASE_URL:https://img.takealook.my}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# WebSocket
ws.ticket.ttl-seconds=${WS_TICKET_TTL:30}
ws.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:5173}
ws.rate-limit.max-messages-per-minute=${WS_MAX_MESSAGES_PER_MINUTE:60}
ws.rate-limit.window-seconds=${WS_RATE_LIMIT_WINDOW_SECONDS:60}

# Observability
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES:false}
management.metrics.tags.application=takealook-backend

# Sentry (disabled when DSN is empty)
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENV:local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.send-default-pii=${SENTRY_SEND_PII:false}

# Logging (request/user context from MDC)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [rid=%X{requestId}] [user=%X{userId}] %logger{36} - %msg%n

# Toss Authentication
toss.decryption-key=${TOSS_DECRYPTION_KEY}
toss.aad=TOSS